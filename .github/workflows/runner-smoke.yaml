# Smoke test for EKS ARC runner scale set.
# ARC: use runnerScaleSetName as a string, OR only scaleSetLabels — do NOT prefix with
# "self-hosted"; that is for classic self-hosted runners and will not match the scale set queue.
# See: https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners-with-actions-runner-controller/using-actions-runner-controller-runners-in-a-workflow
name: Runner smoke

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  probe:
    runs-on: test-hooks-trial
    timeout-minutes: 15
    steps:
      - name: Who am I
        run: |
          set -eux
          uname -a
          echo "Runner OK from $(hostname)"
